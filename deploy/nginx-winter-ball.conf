# Ставится на СЕРВЕР MOODLE (у него публичный IP 188.130.173.173), если там nginx.
#   /etc/nginx/sites-available/winterball.egi.edu.kz
# Moodle не затрагивается: этот блок срабатывает только для имени winterball.egi.edu.kz.
# 192.168.2.102:8095 замените на внутренний IP и порт сервера DoSteam (их печатает deploy.sh).
# HTTPS потом добавит certbot (см. DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name winterball.egi.edu.kz;

    # чеки до 10 МБ + запас
    client_max_body_size 12m;

    location / {
        proxy_pass http://192.168.2.102:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # именно $remote_addr, а не $proxy_add_x_forwarded_for:
        # сайт берёт IP посетителя из этого заголовка для защиты от спама, его нельзя дать подделать
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
