# /etc/nginx/sites-available/winter-ball
# Замените bal.example.kz на свой поддомен. HTTPS добавит certbot (см. DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name bal.example.kz;

    # чеки до 10 МБ + запас
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # именно $remote_addr, а не $proxy_add_x_forwarded_for:
        # сервер берёт IP из этого заголовка для защиты от спама, его нельзя подделать
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
