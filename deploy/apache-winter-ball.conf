# Ставится на СЕРВЕР MOODLE (публичный IP 188.130.173.173), если там Apache.
#   /etc/apache2/sites-available/winterball.egi.edu.kz.conf
# Нужные модули: sudo a2enmod proxy proxy_http headers
# Moodle не затрагивается: этот VirtualHost срабатывает только для имени winterball.egi.edu.kz.
# 10.0.0.20:8090 замените на внутренний IP и порт сервера DoSteam (их печатает deploy.sh).
# HTTPS потом добавит certbot (см. DEPLOY.md).
<VirtualHost *:80>
    ServerName winterball.egi.edu.kz

    ProxyPreserveHost On
    ProxyTimeout 60
    # IP посетителя передаём сами, чтобы его нельзя было подделать заголовком из браузера
    ProxyAddHeaders Off
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"

    # чеки до 10 МБ + запас
    LimitRequestBody 12582912

    ProxyPass        / http://10.0.0.20:8090/ connectiontimeout=5
    ProxyPassReverse / http://10.0.0.20:8090/

    ErrorLog  ${APACHE_LOG_DIR}/winterball-error.log
    CustomLog ${APACHE_LOG_DIR}/winterball-access.log combined
</VirtualHost>
